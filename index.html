<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>三角洲选单</title>
  <meta name="description" content="柏儒电竞三角洲移动端选单页。" />
  <link rel="stylesheet" href="assets/css/mobile-orders.css" />
</head>
<body>
  <main class="mo-app">
    <section class="mo-control">
      <label class="mo-search" aria-label="搜索单子">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M12.5 6.5h7l3.5 5.2v5.7l-3.2 5.1h-7.6l-3.2-5.1v-5.7l3.5-5.2Z" />
          <path d="M16 10.2v6.1m-3.1-3h6.2M11.2 22.4 8 27m12.8-4.6 3.2 4.6" />
        </svg>
        <input id="orderSearch" type="search" autocomplete="off" placeholder="搜索单名 / 出红 / AW / 航天" />
      </label>

      <div class="mo-tabs" id="mainTabs" aria-label="大类选项"></div>
      <div class="mo-subtabs" id="subTabs" aria-label="子选项"></div>
    </section>

    <section class="mo-status" id="orderStatus"></section>
    <section class="mo-list" id="orderList" aria-live="polite"></section>
  </main>

  <div class="mo-viewer" id="imageViewer" hidden>
    <button type="button" class="mo-viewer-close" aria-label="关闭">×</button>
    <img src="bairu_pic_new/爆款.jpg" alt="" />
  </div>

  <script src="assets/js/mobile-orders.js"></script>
</body>
</html>
