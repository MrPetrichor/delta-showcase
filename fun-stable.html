<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>护航体验单 | Delta Elite Hub</title>
  <meta name="description" content="三角洲行动护航、体验、陪玩、指定红单图展示。" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="Delta Elite Hub 首页">
        <span class="logo-mark"></span>
        <span class="logo-text"><strong>DELTA ELITE HUB</strong><span>三角洲行动展示站</span></span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="index.html">首页</a><a class="active" href="fun.html">体验单</a><a href="guns.html">改枪码</a><a href="maps.html">地图点位</a>
      </nav>
    </div>
  </header>

  <main class="service-detail-shell">
    <a class="mini-back" href="fun.html">← 返回</a>

    <section class="service-profile">
      <img src="assets/service-orders/趣味单1.jpg" alt="护航体验单" />
      <div>
        <h1>护航/体验/指定红</h1>
        <p>点击图片可放大查看</p>
      </div>
    </section>

    <section class="service-tabs" aria-label="单子筛选">
      <button class="active" data-order-filter="all">全部</button>
      <button data-order-filter="hot">绝密大红</button>
      <button data-order-filter="task">验牌任务</button>
      <button data-order-filter="challenge">挑战玩法</button>
      <button data-order-filter="playmate">陪玩价格</button>
      <button data-order-filter="rule">护航准则</button>
    </section>

    <section class="order-image-list">
      <article class="order-sheet" id="hot" data-order-group="hot">
        <h2>绝密大红单</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单1.jpg" alt="绝密大红单" />
      </article>
      <article class="order-sheet" id="task" data-order-group="task">
        <h2>验牌任务单</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单2.png" alt="验牌任务单" />
      </article>
      <article class="order-sheet" data-order-group="challenge">
        <h2>冷知识 / 对对碰</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单3.jpg" alt="冷知识与对对碰" />
      </article>
      <article class="order-sheet" data-order-group="challenge">
        <h2>填填乐 / 猛攻</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单4.jpg" alt="填填乐与猛攻" />
      </article>
      <article class="order-sheet" id="playmate" data-order-group="playmate">
        <h2>陪玩价格表</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单5.png" alt="陪玩价格表" />
      </article>
      <article class="order-sheet" data-order-group="rule">
        <h2>护航准则</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单11.jpg" alt="护航准则" />
      </article>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
