<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>爆款趣味单 | Delta Elite Hub</title>
  <meta name="description" content="三角洲行动 Bingo、刮刮乐、大富翁等趣味玩法单展示。" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="Delta Elite Hub 首页">
        <span class="logo-mark"></span>
        <span class="logo-text"><strong>DELTA ELITE HUB</strong><span>三角洲行动展示站</span></span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="index.html">首页</a><a class="active" href="fun.html">体验单</a><a href="guns.html">改枪码</a><a href="maps.html">地图点位</a>
      </nav>
    </div>
  </header>

  <main class="service-detail-shell">
    <a class="mini-back" href="fun.html">← 返回</a>

    <section class="service-profile">
      <img src="assets/service-orders/趣味单9.jpg" alt="爆款趣味单" />
      <div>
        <h1>爆款趣味单</h1>
        <p>点击图片可放大查看</p>
      </div>
    </section>

    <section class="service-tabs" aria-label="单子筛选">
      <button class="active" data-order-filter="all">全部</button>
      <button data-order-filter="bingo">Bingo</button>
      <button data-order-filter="scratch">刮刮乐</button>
      <button data-order-filter="monopoly">大富翁</button>
      <button data-order-filter="exchange">兑换/六套</button>
      <button data-order-filter="boss">老板玩法</button>
    </section>

    <section class="order-image-list">
      <article class="order-sheet" id="bingo" data-order-group="bingo">
        <h2>Bingo 玩法单</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单9.jpg" alt="Bingo玩法单" />
      </article>
      <article class="order-sheet" id="scratch" data-order-group="scratch">
        <h2>三角洲刮刮乐</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单8.png" alt="三角洲刮刮乐" />
      </article>
      <article class="order-sheet" id="monopoly" data-order-group="monopoly">
        <h2>大富翁困难版</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单10.png" alt="大富翁困难版" />
      </article>
      <article class="order-sheet" data-order-group="exchange">
        <h2>六套兑换计划</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单7.jpg" alt="六套兑换计划" />
      </article>
      <article class="order-sheet" data-order-group="boss">
        <h2>结婚 / 保险 / 老板玩法</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单6.png" alt="三角洲价格表" />
      </article>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
