<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新版体验单 | Delta Elite Hub</title>
  <meta name="description" content="三角洲行动体验单新版浏览页。" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="Delta Elite Hub 首页">
        <span class="logo-mark"></span>
        <span class="logo-text"><strong>DELTA ELITE HUB</strong><span>三角洲行动展示站</span></span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="index.html">首页</a><a class="active" href="fun.html">体验单</a><a href="guns.html">改枪码</a><a href="maps.html">地图点位</a>
      </nav>
    </div>
  </header>

  <main class="order-v2-shell">
    <section class="order-v2-hero">
      <a class="mini-back" href="fun.html">← 当前版</a>
      <p class="order-v2-kicker">BAIRU ESPORTS</p>
      <h1>三角洲体验菜单</h1>
      <div class="order-v2-actions">
        <a href="#orders">查看单图</a>
        <a href="fun.html">返回旧版</a>
      </div>
    </section>

    <section class="order-v2-feature">
      <img class="zoomable-image" src="assets/service-orders/趣味单9.jpg" alt="Bingo玩法单" />
      <div>
        <span>主推玩法</span>
        <h2>Bingo / 刮刮乐 / 大富翁</h2>
      </div>
    </section>

    <section class="order-v2-categories" aria-label="单子分类">
      <button class="active" data-order-filter="all">
        <span>全部</span><strong>11</strong>
      </button>
      <button data-order-filter="escort">
        <span>护航</span><strong>6</strong>
      </button>
      <button data-order-filter="fun">
        <span>趣味</span><strong>5</strong>
      </button>
      <button data-order-filter="rule">
        <span>须知</span><strong>4</strong>
      </button>
    </section>

    <section class="order-v2-picks">
      <a href="#escort-main">
        <img src="assets/service-orders/趣味单1.jpg" alt="绝密大红单" />
        <span>护航体验</span>
      </a>
      <a href="#bingo-main">
        <img src="assets/service-orders/趣味单9.jpg" alt="Bingo玩法单" />
        <span>Bingo</span>
      </a>
      <a href="#scratch-main">
        <img src="assets/service-orders/趣味单8.png" alt="刮刮乐" />
        <span>刮刮乐</span>
      </a>
      <a href="#rule-main">
        <img src="assets/service-orders/趣味单11.jpg" alt="规则须知" />
        <span>规则须知</span>
      </a>
    </section>

    <section class="order-image-list order-v2-list" id="orders">
      <article class="order-sheet order-v2-sheet" id="escort-main" data-order-group="escort">
        <h2>绝密大红单</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单1.jpg" alt="绝密大红单" />
      </article>
      <article class="order-sheet order-v2-sheet" data-order-group="escort">
        <h2>验牌任务单</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单2.png" alt="验牌任务单" />
      </article>
      <article class="order-sheet order-v2-sheet" data-order-group="escort">
        <h2>冷知识 / 对对碰</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单3.jpg" alt="冷知识与对对碰" />
      </article>
      <article class="order-sheet order-v2-sheet" data-order-group="escort">
        <h2>填填乐 / 猛攻</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单4.jpg" alt="填填乐与猛攻" />
      </article>
      <article class="order-sheet order-v2-sheet" data-order-group="escort">
        <h2>陪玩价格表</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单5.png" alt="陪玩价格表" />
      </article>
      <article class="order-sheet order-v2-sheet" id="bingo-main" data-order-group="fun">
        <h2>Bingo 玩法单</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单9.jpg" alt="Bingo玩法单" />
      </article>
      <article class="order-sheet order-v2-sheet" id="scratch-main" data-order-group="fun">
        <h2>三角洲刮刮乐</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单8.png" alt="三角洲刮刮乐" />
      </article>
      <article class="order-sheet order-v2-sheet" data-order-group="fun">
        <h2>大富翁困难版</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单10.png" alt="大富翁困难版" />
      </article>
      <article class="order-sheet order-v2-sheet" data-order-group="fun">
        <h2>六套兑换计划</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单7.jpg" alt="六套兑换计划" />
      </article>
      <article class="order-sheet order-v2-sheet" data-order-group="fun">
        <h2>结婚 / 保险 / 老板玩法</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单6.png" alt="三角洲价格表" />
      </article>
      <article class="order-sheet order-v2-sheet" id="rule-main" data-order-group="rule">
        <h2>护航准则</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单11.jpg" alt="护航准则" />
      </article>
      <article class="order-sheet order-v2-sheet" data-order-group="rule">
        <h2>Bingo 玩法说明</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单9.jpg" alt="Bingo玩法说明" />
      </article>
      <article class="order-sheet order-v2-sheet" data-order-group="rule">
        <h2>刮刮乐玩法说明</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单8.png" alt="刮刮乐玩法说明" />
      </article>
      <article class="order-sheet order-v2-sheet" data-order-group="rule">
        <h2>大富翁玩法说明</h2>
        <img class="zoomable-image" src="assets/service-orders/趣味单10.png" alt="大富翁玩法说明" />
      </article>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
